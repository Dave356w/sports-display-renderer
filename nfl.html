<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NFC West E-Paper Display</title>
  <meta name="description" content="Live NFC West standings and weekly schedule rendered for a 7.3-inch 480x800 e-paper display.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #071522; color: #eef4f8; }
    main { width: min(980px, 94vw); margin: 0 auto; padding: 32px 0 48px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 4vw, 3rem); }
    p { margin: 0; color: #b9c8d4; line-height: 1.5; }
    .card { margin-top: 22px; padding: 18px; border: 1px solid #29455b; border-radius: 18px; background: #0c1e2d; box-shadow: 0 18px 50px rgba(0,0,0,.28); }
    img { display: block; width: min(480px, 100%); height: auto; margin: 0 auto; background: white; border-radius: 6px; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; justify-content: center; }
    a { color: #fff; text-decoration: none; border: 1px solid #3b607c; border-radius: 999px; padding: 9px 14px; }
    a:hover { background: #15354d; }
    .meta { margin-top: 14px; text-align: center; font-size: .9rem; color: #8fa6b7; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>NFC West E-Paper Display</h1>
      <p>Live NFC West standings and this week's games, rendered at the reTerminal E1002's native 480×800 portrait resolution.</p>
    </header>
    <section class="card">
      <img id="display" src="public/nfl_nfc_west.png" alt="NFC West standings e-paper display" width="480" height="800">
      <nav>
        <a href="public/nfl_nfc_west.png">Open PNG</a>
        <a href="https://github.com/Dave356w/sports-display-renderer">Repository</a>
      </nav>
      <div class="meta">The image is regenerated automatically by GitHub Actions.</div>
    </section>
  </main>
  <script>document.getElementById("display").src = "public/nfl_nfc_west.png?v=" + Date.now();</script>
</body>
</html>
